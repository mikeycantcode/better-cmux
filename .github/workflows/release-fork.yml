name: Release (fork)

# Fork-tailored release pipeline for mikeycantcode/better-cmux.
#
# Unlike the upstream release.yml (which hard-requires Sparkle keys, a manaflow
# provisioning profile, Cloudflare R2, Sentry, and remote-daemon attestation),
# this workflow only needs free GitHub-hosted macOS runners. It builds a
# universal cmux.app + a drag-to-install DMG and attaches it to the GitHub
# Release for the pushed tag.
#
# Signing is automatic-but-optional:
#   * If the Apple Developer ID secrets are present, the app + DMG are signed
#     and notarized (no Gatekeeper warning for end users).
#   * If they are absent, the app is ad-hoc signed and the DMG is unsigned —
#     it still installs, but users must right-click -> Open the first time
#     (or run: xattr -dr com.apple.quarantine "/Applications/bettercmux 1.0.app").
#
# To enable notarization, add these repo secrets (requires a PAID Apple
# Developer Program membership and a "Developer ID Application" certificate):
#   APPLE_CERTIFICATE_BASE64        base64 of the exported Developer ID .p12
#   APPLE_CERTIFICATE_PASSWORD      password used when exporting the .p12
#   APPLE_SIGNING_IDENTITY          e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                        Apple ID email for notarytool
#   APPLE_APP_SPECIFIC_PASSWORD     app-specific password from appleid.apple.com
#   APPLE_TEAM_ID                   10-char team id
#
# GitHub-hosted macOS runner labels can be overridden with repo variables
# MACOS_RUNNER_15 / MACOS_RUNNER_26 if the defaults ever change.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CREATE_DMG_VERSION: 8.0.0

jobs:
  build-ghostty-cli-helper:
    # Only run on the fork; the upstream repo uses release.yml instead.
    if: github.repository != 'manaflow-ai/cmux'
    runs-on: ${{ vars.MACOS_RUNNER_15 || 'macos-15' }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Cache Zig packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/zig
          key: zig-packages-${{ hashFiles('ghostty/build.zig.zon', 'ghostty/build.zig.zon.json') }}
          restore-keys: zig-packages-

      - name: Build universal Ghostty CLI helper
        run: |
          set -euo pipefail
          mkdir -p ghostty-cli-helper
          ./scripts/build-ghostty-cli-helper.sh --universal --output ghostty-cli-helper/ghostty
          lipo ghostty-cli-helper/ghostty -verify_arch arm64 x86_64

      - name: Upload universal Ghostty CLI helper
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper/ghostty
          if-no-files-found: error

  build-app:
    if: github.repository != 'manaflow-ai/cmux'
    needs: build-ghostty-cli-helper
    # Build on macOS 26 so SDK-gated SwiftUI Liquid Glass code compiles.
    runs-on: ${{ vars.MACOS_RUNNER_26 || 'macos-26' }}
    timeout-minutes: 60
    env:
      # True only when the full Developer ID secret set is configured.
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -euo pipefail
          if [ -d "/Applications/Xcode.app/Contents/Developer" ]; then
            XCODE_DIR="/Applications/Xcode.app/Contents/Developer"
          else
            XCODE_APP="$(find /Applications -maxdepth 1 -name 'Xcode*.app' -print 2>/dev/null | sort | tail -n 1 || true)"
            if [ -n "$XCODE_APP" ]; then
              XCODE_DIR="$XCODE_APP/Contents/Developer"
            else
              echo "No Xcode.app found under /Applications" >&2
              exit 1
            fi
          fi
          echo "DEVELOPER_DIR=$XCODE_DIR" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$XCODE_DIR"
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path

      - name: Install build deps
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          if ! command -v rustup >/dev/null 2>&1; then
            export HOMEBREW_NO_AUTO_UPDATE=1
            export HOMEBREW_NO_INSTALL_CLEANUP=1
            export HOMEBREW_NO_ENV_HINTS=1
            brew install rustup-init
            rustup-init -y --profile minimal --default-toolchain stable
          fi
          if ! rustup show active-toolchain >/dev/null 2>&1; then
            rustup default stable
          fi
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          npm install --global "create-dmg@${CREATE_DMG_VERSION}"

      - name: Download pre-built GhosttyKit.xcframework
        run: ./scripts/download-prebuilt-ghosttykit.sh

      - name: Cache Swift packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .spm-cache
          key: spm-${{ hashFiles('cmux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-

      - name: Build universal app (Release)
        run: |
          CMUX_SKIP_ZIG_BUILD=1 xcodebuild -scheme cmux -configuration Release -derivedDataPath build-universal \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath .spm-cache \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO build

      - name: Download universal Ghostty CLI helper
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: cmux-ghostty-cli-helper
          path: ghostty-cli-helper

      - name: Install universal Ghostty CLI helper
        run: |
          set -euo pipefail
          ./scripts/install-prebuilt-ghostty-cli-helper.sh \
            ghostty-cli-helper/ghostty \
            build-universal/Build/Products/Release/cmux.app

      - name: Verify binary architectures
        run: |
          set -euo pipefail
          APP_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/MacOS/cmux"
          CLI_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/cmux"
          HELPER_BINARY="build-universal/Build/Products/Release/cmux.app/Contents/Resources/bin/ghostty"
          APP_ARCHS="$(lipo -archs "$APP_BINARY")"
          CLI_ARCHS="$(lipo -archs "$CLI_BINARY")"
          HELPER_ARCHS="$(lipo -archs "$HELPER_BINARY")"
          SDK_VERSION="$(otool -l "$APP_BINARY" | awk '/LC_BUILD_VERSION/ { in_version=1; next } in_version && /sdk / { print $2; exit }')"
          echo "App binary architectures: $APP_ARCHS"
          echo "CLI binary architectures: $CLI_ARCHS"
          echo "Ghostty helper architectures: $HELPER_ARCHS"
          echo "App SDK version: $SDK_VERSION"
          [[ "$APP_ARCHS" == *arm64* && "$APP_ARCHS" == *x86_64* ]]
          [[ "$CLI_ARCHS" == *arm64* && "$CLI_ARCHS" == *x86_64* ]]
          [[ "$HELPER_ARCHS" == *arm64* && "$HELPER_ARCHS" == *x86_64* ]]
          case "$SDK_VERSION" in
            26.*) : ;;
            *) echo "::warning::App built against SDK $SDK_VERSION (not 26.x); Liquid Glass UI may be disabled." ;;
          esac

      # ---- Signed + notarized path (only when Developer ID secrets exist) ----
      - name: Import signing cert
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security list-keychains -d user -s build.keychain

      - name: Codesign + notarize app, build signed DMG
        if: env.HAS_APPLE_SIGNING == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          APP_PATH="build-universal/Build/Products/Release/cmux.app"
          DMG_RELEASE="bettercmux-macos.dmg"
          ./scripts/sign-cmux-bundle.sh "$APP_PATH" cmux.release.entitlements "$APPLE_SIGNING_IDENTITY"
          ZIP_SUBMIT="cmux-notary.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_SUBMIT"
          APP_JSON="$(xcrun notarytool submit "$ZIP_SUBMIT" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          APP_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$APP_JSON")"
          if [ "$APP_STATUS" != "Accepted" ]; then echo "App notarization failed: $APP_STATUS" >&2; exit 1; fi
          xcrun stapler staple "$APP_PATH"
          rm -f "$ZIP_SUBMIT"
          create-dmg --identity="$APPLE_SIGNING_IDENTITY" "$APP_PATH" ./
          mv ./cmux*.dmg "$DMG_RELEASE"
          DMG_JSON="$(xcrun notarytool submit "$DMG_RELEASE" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait --output-format json)"
          DMG_STATUS="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$DMG_JSON")"
          if [ "$DMG_STATUS" != "Accepted" ]; then echo "DMG notarization failed: $DMG_STATUS" >&2; exit 1; fi
          xcrun stapler staple "$DMG_RELEASE"

      # ---- Ad-hoc / unsigned path (no Developer ID secrets) ----
      - name: Ad-hoc sign app + build unsigned DMG
        if: env.HAS_APPLE_SIGNING != 'true'
        run: |
          set -euo pipefail
          APP_PATH="build-universal/Build/Products/Release/cmux.app"
          DMG_RELEASE="bettercmux-macos.dmg"
          echo "::notice::No Developer ID secrets configured — producing an ad-hoc signed, un-notarized build."
          # Ad-hoc sign so the app launches locally; Gatekeeper still warns on first open.
          codesign --force --deep --sign - "$APP_PATH"
          # create-dmg (v8) requires a code-signing identity, which this runner
          # lacks, so build a plain drag-to-install DMG with hdiutil instead.
          STAGING="$(mktemp -d)"
          cp -R "$APP_PATH" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          rm -f "$DMG_RELEASE"
          hdiutil create -volname "bettercmux 1.0" -srcfolder "$STAGING" -ov -format UDZO "$DMG_RELEASE"
          rm -rf "$STAGING"

      - name: Verify DMG exists
        run: |
          set -euo pipefail
          ls -lh bettercmux-macos.dmg
          hdiutil imageinfo bettercmux-macos.dmg >/dev/null

      - name: Upload build artifact (workflow_dispatch dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bettercmux-macos-dmg
          path: bettercmux-macos.dmg
          if-no-files-found: error

      - name: Publish release asset
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: bettercmux-macos.dmg
          generate_release_notes: true

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain build.keychain >/dev/null 2>&1 || true
          rm -f /tmp/cert.p12
