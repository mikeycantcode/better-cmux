<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body, #container { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    body { background: transparent; }
  </style>
  <link rel="stylesheet" href="cmux-monaco://app/vs/editor/editor.main.css" />
</head>
<body>
  <div id="container"></div>
  <script>
    // Syntax-only (v1): route the worker to an inert no-op script so the editor
    // never fetches a real worker over the custom scheme (which WebKit blocks
    // cross-scheme). Tokenization for highlighting runs on the main thread.
    // Revoke any prior blob URL before recreating it on a recovery reload so the
    // object URLs do not accumulate across reloads.
    if (self.__cmuxNoopWorker) URL.revokeObjectURL(self.__cmuxNoopWorker);
    self.__cmuxNoopWorker = URL.createObjectURL(new Blob(["self.onmessage=function(){};"], { type: "text/javascript" }));
    self.MonacoEnvironment = { getWorkerUrl: function () { return self.__cmuxNoopWorker; } };

    function post(msg) {
      try { window.webkit.messageHandlers.cmuxMonacoBridge.postMessage(msg); } catch (e) {}
    }
    // Surface a fatal load error directly in the (otherwise blank) pane so a
    // failure is diagnosable without the Web Inspector, and report it to Swift.
    function showFatal(message) {
      try { console.error("monaco shell error:", message); } catch (e) {}
      try {
        var el = document.getElementById("container");
        if (el) {
          el.style.cssText = "white-space:pre-wrap;font:12px ui-monospace,monospace;color:#f85149;padding:12px;overflow:auto;";
          el.textContent = "Monaco failed to load:\n" + message;
        }
      } catch (e) {}
      post({ type: "loadError", message: String(message) });
    }
    window.onerror = function (message, src, line, col) {
      showFatal(String(message) + (src ? " @ " + src + ":" + line + ":" + col : ""));
    };
  </script>
  <script src="cmux-monaco://app/vs/loader.js"></script>
  <script>
    // Map the `vs/` module prefix to the bundle path. Do NOT use `baseUrl`:
    // module ids already start with `vs/`, so baseUrl would resolve
    // `vs/editor/editor.main` to `.../vs/vs/editor/editor.main.js` (doubled vs).
    require.config({ paths: { vs: "cmux-monaco://app/vs" } });
    require.onError = function (err) {
      showFatal((err && err.message ? err.message : String(err)) +
        (err && err.errorCode ? " [" + err.errorCode + "]" : "") +
        (err && err.moduleId ? " module=" + err.moduleId : ""));
    };
    require(["vs/editor/editor.main"], function () {
      // cmux themes: derived from the app's default terminal theme
      // (Resources/ghostty/themes/Apple System Colors) so the editor reads as the
      // same product as the terminal instead of stock VS Code.
      // Palette: 1 #cc372e  2 #26a439  3 #cdac08  4 #0869cb  5 #9647bf  6 #479ec2
      //          7 #98989d  9 #ff453a 10 #32d74b 11 #ffd60a 12 #0a84ff 13 #bf5af2 14 #76d6ff
      monaco.editor.defineTheme("cmux-dark", {
        base: "vs-dark",
        inherit: true,
        rules: [
          { token: "", foreground: "ffffff" },
          { token: "comment", foreground: "98989d", fontStyle: "italic" },
          { token: "keyword", foreground: "bf5af2" },
          { token: "keyword.control", foreground: "bf5af2" },
          { token: "operator", foreground: "98989d" },
          { token: "delimiter", foreground: "98989d" },
          { token: "string", foreground: "32d74b" },
          { token: "string.escape", foreground: "76d6ff" },
          { token: "regexp", foreground: "ff453a" },
          { token: "number", foreground: "ffd60a" },
          { token: "constant", foreground: "ffd60a" },
          { token: "type", foreground: "76d6ff" },
          { token: "type.identifier", foreground: "76d6ff" },
          { token: "namespace", foreground: "76d6ff" },
          { token: "struct", foreground: "76d6ff" },
          { token: "class", foreground: "76d6ff" },
          { token: "interface", foreground: "76d6ff" },
          { token: "enum", foreground: "76d6ff" },
          { token: "function", foreground: "0a84ff" },
          { token: "identifier", foreground: "ffffff" },
          { token: "variable", foreground: "ffffff" },
          { token: "variable.predefined", foreground: "0a84ff" },
          { token: "parameter", foreground: "ffffff" },
          { token: "attribute.name", foreground: "0a84ff" },
          { token: "attribute.value", foreground: "32d74b" },
          { token: "tag", foreground: "bf5af2" },
          { token: "metatag", foreground: "98989d" },
          { token: "annotation", foreground: "cdac08" },
          { token: "key", foreground: "0a84ff" },
          { token: "invalid", foreground: "ff453a" }
        ],
        colors: {
          "editor.background": "#1e1e1e",
          "editor.foreground": "#ffffff",
          "editor.lineHighlightBackground": "#2a2a2a",
          "editor.selectionBackground": "#3f638b",
          "editor.inactiveSelectionBackground": "#3f638b66",
          "editorCursor.foreground": "#98989d",
          "editorLineNumber.foreground": "#5a5a5e",
          "editorLineNumber.activeForeground": "#98989d",
          "editorIndentGuide.background1": "#2f2f2f",
          "editorWhitespace.foreground": "#3a3a3a",
          "editorGutter.background": "#1e1e1e",
          "editorWidget.background": "#252525",
          "editorWidget.border": "#3a3a3a",
          "editorSuggestWidget.background": "#252525",
          "editorSuggestWidget.selectedBackground": "#0a84ff44",
          "editorHoverWidget.background": "#252525",
          "editorBracketMatch.background": "#0a84ff33",
          "editorBracketMatch.border": "#0a84ff",
          "scrollbarSlider.background": "#4646467f",
          "scrollbarSlider.hoverBackground": "#5a5a5ea0",
          "minimap.background": "#1e1e1e",
          "diffEditor.insertedTextBackground": "#32d74b22",
          "diffEditor.removedTextBackground": "#ff453a22"
        }
      });
      monaco.editor.defineTheme("cmux-light", {
        base: "vs",
        inherit: true,
        rules: [
          { token: "", foreground: "000000" },
          { token: "comment", foreground: "6e6e73", fontStyle: "italic" },
          { token: "keyword", foreground: "9647bf" },
          { token: "keyword.control", foreground: "9647bf" },
          { token: "operator", foreground: "3c3c43" },
          { token: "delimiter", foreground: "3c3c43" },
          { token: "string", foreground: "26a439" },
          { token: "string.escape", foreground: "479ec2" },
          { token: "regexp", foreground: "cc372e" },
          { token: "number", foreground: "a67c00" },
          { token: "constant", foreground: "a67c00" },
          { token: "type", foreground: "0f7490" },
          { token: "type.identifier", foreground: "0f7490" },
          { token: "namespace", foreground: "0f7490" },
          { token: "struct", foreground: "0f7490" },
          { token: "class", foreground: "0f7490" },
          { token: "interface", foreground: "0f7490" },
          { token: "enum", foreground: "0f7490" },
          { token: "function", foreground: "0869cb" },
          { token: "identifier", foreground: "000000" },
          { token: "variable", foreground: "000000" },
          { token: "variable.predefined", foreground: "0869cb" },
          { token: "parameter", foreground: "000000" },
          { token: "attribute.name", foreground: "0869cb" },
          { token: "attribute.value", foreground: "26a439" },
          { token: "tag", foreground: "9647bf" },
          { token: "metatag", foreground: "6e6e73" },
          { token: "annotation", foreground: "a67c00" },
          { token: "key", foreground: "0869cb" },
          { token: "invalid", foreground: "cc372e" }
        ],
        colors: {
          "editor.background": "#feffff",
          "editor.foreground": "#000000",
          "editor.lineHighlightBackground": "#f0f2f4",
          "editor.selectionBackground": "#abd8ff",
          "editorCursor.foreground": "#3c3c43",
          "editorLineNumber.foreground": "#b0b0b5",
          "editorLineNumber.activeForeground": "#3c3c43",
          "editorBracketMatch.background": "#0869cb22",
          "editorBracketMatch.border": "#0869cb",
          "minimap.background": "#feffff",
          "diffEditor.insertedTextBackground": "#26a43922",
          "diffEditor.removedTextBackground": "#cc372e22"
        }
      });

      var editor = monaco.editor.create(document.getElementById("container"), {
        value: "",
        language: "plaintext",
        theme: "cmux-dark",
        automaticLayout: true,
        minimap: { enabled: true },
        scrollBeyondLastLine: false,
        fontLigatures: true
      });

      var diffEditor = null;

      var suppressChange = false;   // true while we apply content from Swift
      var saveTimer = null;
      var SAVE_DEBOUNCE_MS = 600;
      var editingPending = false;   // true between first keystroke and save

      function scheduleSave() {
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
          saveTimer = null;
          editingPending = false;
          post({ type: "change", content: editor.getValue() });
        }, SAVE_DEBOUNCE_MS);
      }

      editor.onDidChangeModelContent(function () {
        if (suppressChange) return;
        // Fire `editing` on the first keystroke of a burst (throttled by
        // `editingPending`) so Swift marks a local edit in flight before the
        // debounced save lands; this lets an external on-disk change keep the
        // buffer (last-write-wins favoring the user's edit).
        if (!editingPending) {
          editingPending = true;
          post({ type: "editing" });
        }
        scheduleSave();
      });
      editor.onDidFocusEditorWidget(function () { post({ type: "focus" }); });
      editor.onDidBlurEditorWidget(function () { post({ type: "blur" }); });

      // Cmd+S -> immediate save (even in auto-save mode).
      editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {
        if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
        editingPending = false;
        post({ type: "requestSave", content: editor.getValue() });
      });

      // Swift -> JS API.
      window.cmuxMonaco = {
        setDiff: function (original, modified, language, theme) {
          if (theme) monaco.editor.setTheme(theme);
          // This page always mounts the single `editor` at load; a diff controller only ever
          // calls setDiff. Hide the (empty) single editor so it does not show as a blank strip
          // above the diff sharing the same #container.
          if (editor && editor.getDomNode()) editor.getDomNode().style.display = "none";
          var originalModel = monaco.editor.createModel(original, language || "plaintext");
          var modifiedModel = monaco.editor.createModel(modified, language || "plaintext");
          if (!diffEditor) {
            diffEditor = monaco.editor.createDiffEditor(document.getElementById("container"), {
              automaticLayout: true,
              readOnly: true,
              originalEditable: false,
              renderSideBySide: true,
              minimap: { enabled: false },
              scrollBeyondLastLine: false
            });
          }
          diffEditor.setModel({ original: originalModel, modified: modifiedModel });
        },
        setContent: function (text, language, theme) {
          suppressChange = true;
          var model = editor.getModel();
          if (model) {
            model.setValue(text);
            if (language) monaco.editor.setModelLanguage(model, language);
          } else {
            editor.setValue(text);
          }
          if (theme) monaco.editor.setTheme(theme);
          suppressChange = false;
        },
        applyExternalChange: function (text) {
          suppressChange = true;
          var pos = editor.getPosition();
          editor.getModel().setValue(text);
          if (pos) editor.setPosition(pos);
          suppressChange = false;
        },
        setTheme: function (theme) { monaco.editor.setTheme(theme); },
        focus: function () { editor.focus(); },
        currentValue: function () { return editor.getValue(); },
        flushSave: function () {
          if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
          editingPending = false;
          post({ type: "requestSave", content: editor.getValue() });
        }
      };

      post({ type: "ready" });
    });
  </script>
</body>
</html>
